<div id="app"></div>

    --bg: #eef2f4; --ink: #16232c; --ink-soft: #4a5c66; --line: #d6dfe3;

    --accent: #1f5c78; --accent-deep: #123c4f;

  }
  #app *{ box-sizing:border-box; }
  #app{ font-family: var(--sans); color: var(--ink); background: var(--bg); min-height:100%; max-width:640px; margin:0 auto; }
  .topbar{ background: var(--accent-deep); color:#eaf1f4; padding:18px 20px 16px; }
  .topbar h1{ margin:0; font-size:20px; font-weight:600; }
  .topbar p{ margin:4px 0 0; font-size:13px; color:#a9c3cf; }
  .lang-switch{ display:flex; gap:6px; margin-bottom:10px; }
  .lang-btn{ font-size:12px; font-weight:700; letter-spacing:.03em; padding:5px 12px; border-radius:20px; border:1px solid rgba(255,255,255,0.3); background:transparent; color:#a9c3cf; cursor:pointer; }
  .lang-btn.active{ background:#eaf1f4; color:var(--accent-deep); border-color:#eaf1f4; }
  .intervento-badge{ display:inline-block; margin-top:10px; font-family: var(--mono); font-size:12.5px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.25); padding:5px 11px; border-radius:6px; color:#dceaf0; }
  .intervento-badge b{ color:#fff; }
  .tabs{ display:flex; gap:2px; margin-top:16px; }
  .tab{ font-size:13px; font-weight:600; padding:8px 14px; border-radius:6px 6px 0 0; cursor:pointer; color:#a9c3cf; background:transparent; border:none; }
  .tab.active{ background: var(--bg); color:var(--accent-deep); }
  .content{ padding:18px 20px 60px; }
  .rail{ display:flex; gap:3px; margin-bottom:20px; flex-wrap:wrap; align-items:center; }
  .dot{ width:20px; height:5px; border-radius:3px; background:var(--line); }
  .dot.done{ background: var(--ok); } .dot.current{ background: var(--accent); }
  .rail-label{ font-family:var(--mono); font-size:11px; color:var(--ink-soft); margin-left:6px; }
  .card{ background: var(--surface); border:1px solid var(--line); border-radius: var(--radius); padding:16px; margin-bottom:12px; }
  .card.locked{ background: var(--surface-locked); color:#9aa8ae; }
  .card.locked h3, .card.locked .field-label{ color:#9aa8ae; }
  .field{ margin-bottom:14px; } .field:last-child{ margin-bottom:0; }
  .field-label{ display:block; font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); margin-bottom:6px; }
  select, input[type=text], input[type=date], textarea{ width:100%; font-size:14px; padding:10px 12px; border-radius:7px; border:1px solid var(--line); background:#fff; color:var(--ink); }
  textarea{ min-height:70px; resize:vertical; }
  .photo-drop{ display:block; border:1.5px dashed var(--line); border-radius:8px; padding:14px; text-align:center; cursor:pointer; font-size:13px; color:var(--ink-soft); background:#fbfcfc; }
  .photo-drop input{ display:none; }
  .thumbs{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .thumb{ width:64px; height:64px; border-radius:6px; overflow:hidden; border:1px solid var(--line); position:relative; }
  .thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .item-head{ display:flex; gap:12px; }
  .item-num{ font-family: var(--mono); font-weight:700; font-size:13px; width:28px; height:28px; min-width:28px; border-radius:6px; display:flex; align-items:center; justify-content:center; background: var(--accent-deep); color:#dceaf0; }
  .card.locked .item-num{ background:#c9d3d7; color:#fff; }
  .card.answered-ok .item-num{ background: var(--ok); }
  .card.answered-warn .item-num{ background: var(--warn); }
  h3{ font-size:14.5px; font-weight:600; margin:0 0 4px; }
  .note-hint{ font-size:12px; color:var(--ink-soft); margin:0 0 12px; }
  .toggle-row{ display:flex; gap:8px; margin-top:10px; }
  .toggle-btn{ flex:1; padding:9px; border-radius:7px; border:1px solid var(--line); background:#fff; font-weight:600; font-size:13px; cursor:pointer; color:var(--ink-soft); }
  .toggle-btn.yes.active{ background: var(--ok-bg); border-color:var(--ok); color:var(--ok); }
  .toggle-btn.no.active{ background: var(--warn-bg); border-color:var(--warn); color:var(--warn); }
  .toggle-btn:disabled{ opacity:.5; cursor:not-allowed; }
  .conditional{ margin-top:12px; padding-top:12px; border-top:1px dashed var(--line); }
  .esito-box{ border-radius: var(--radius); padding:16px; margin-bottom:14px; border:1px solid var(--line); background:#fff; }
  .esito-pill{ font-family:var(--mono); font-size:12px; font-weight:600; padding:4px 10px; border-radius:20px; }
  .esito-pill.ok{ background: var(--ok-bg); color:var(--ok); }
  .esito-pill.warn{ background: var(--warn-bg); color:var(--warn); }
  .esito-pill.pending{ background:#eef1f2; color:var(--ink-soft); }
  .btn{ width:100%; padding:13px; border-radius:8px; border:none; font-weight:600; font-size:14.5px; cursor:pointer; background: var(--accent); color:#fff; margin-top:6px; }
  .btn:disabled{ background:#c3ccd0; cursor:not-allowed; }
  .row2{ display:flex; gap:10px; } .row2 > div{ flex:1; }
  .history-item{ background:#fff; border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:10px; }
  .history-top{ display:flex; justify-content:space-between; }
  .history-mat{ font-family:var(--mono); font-weight:700; font-size:13.5px; }
  .history-meta{ font-size:12px; color:var(--ink-soft); margin-top:3px; }
  .empty-state{ text-align:center; color:var(--ink-soft); font-size:13.5px; padding:40px 10px; }
  .banner-ok{ background: var(--ok-bg); color:var(--ok); border:1px solid var(--ok); border-radius:8px; padding:12px 14px; font-size:13.5px; margin-bottom:14px; }
  .banner-warn{ background: var(--warn-bg); color:var(--warn); border:1px solid var(--warn); border-radius:8px; padding:12px 14px; font-size:13.5px; margin-bottom:14px; }
  .config-note{ font-size:12px; color:var(--ink-soft); background:#fff8e5; border:1px solid #f0e0a0; padding:10px 12px; border-radius:8px; margin-bottom:14px; }
  .footer-hint{ font-size:11.5px; color:var(--ink-soft); margin:12px 0 4px; line-height:1.5; }
  .autocomplete-list{ position:absolute; top:2px; left:0; right:0; background:#fff; border:1.5px solid var(--accent); border-top:none; border-radius:0 0 9px 9px; max-height:230px; overflow-y:auto; z-index:30; box-shadow:0 8px 20px rgba(18,60,79,.15); }
  .autocomplete-item{ padding:10px 13px; cursor:pointer; font-size:13.5px; border-bottom:1px solid var(--bg); }
  .autocomplete-item:hover{ background: var(--bg); }
  .autocomplete-item b{ color: var(--ink); }
  .autocomplete-item .meta{ color: var(--ink-soft); font-size:12px; margin-top:2px; }

  async function loadNumeroIntervento(){

  function currentStep(){
    if(!state.matricola || !state.tecnico) return 0;
    for(let i=0;i<state.items.length;i++){ if(state.items[i].ok===null) return i+1; }
    return 10;
  }
  function allAnswered(){ return state.items.every(it=>it.ok!==null); }
  function esitoStatus(){
    if(!allAnswered()) return 'pending';
    return state.items.some(it=>it.ok===false) ? 'warn' : 'ok';
  }

  // Ridimensiona e comprime una foto prima di convertirla in base64
  function compressPhoto(file, cb){
    const reader = new FileReader();
    reader.onload = function(e){
      const img = new Image();
      img.onload = function(){
        const maxW = 1000;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        cb(canvas.toDataURL('image/jpeg', 0.7));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  async function saveIntervento(){
    state.saving = true; state.errorMsg=''; render();
    const payload = {
      numeroIntervento: state.numeroIntervento,
      matricola: state.matricola, data: state.data, tecnico: state.tecnico,
      puntoVendita: state.puntoVendita, firma: state.tecnico,
      fotoGenerale: state.fotoGenerale,
      items: state.items.map((it,i)=>({ voce: items()[i].title, ok: it.ok, note: it.note, soluzione: it.soluzione, foto: it.foto })),
      noteFinali: state.noteFinali
    };
    try{
      await fetch(WEBAPP_URL, {
        method: 'POST', mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
        body: JSON.stringify(payload)
      });
      state.savedMsg = t().savedMsg(state.matricola);
      state.matricola=''; state.tecnico=''; state.puntoVendita=''; state.fotoGenerale=[]; state.noteFinali='';
      state.items = items().map(()=>({ ok:null, note:'', soluzione:'', foto:[] }));
      loadNumeroIntervento();
    }catch(err){
      state.errorMsg = t().errorMsg;
      console.error(err);
    }
    state.saving = false; render();
  }

  function esc(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function render(){
    const step = currentStep();
    const root = document.getElementById('app');

          <button class="lang-btn ${state.lang==='de'?'active':''}" data-lang="de">DE</button>

      html += `<div class="config-note">${t().configNote}</div>`;
    }
    html += renderForm(step);
    html += `</div>`;
    root.innerHTML = html;
    bindEvents();

  function renderRail(step){
    let dots = '';
    for(let i=0;i<11;i++){
      let cls = 'dot';
      if(i < step) cls += ' done'; else if(i === step) cls += ' current';
      dots += `<div class="${cls}"></div>`;
    }
    return `<div class="rail">${dots}<span class="rail-label">${Math.min(step,10)}/10</span></div>`;
  }

    }
    if(matricola){
      matricola.oninput = e=>{ state.matricola = e.target.value; state.puntoVendita=''; filterList(e.target.value); };
      matricola.onfocus = e=>{ if(e.target.value) filterList(e.target.value); };
      matricola.onblur = ()=> setTimeout(()=>{ if(matList) matList.innerHTML=''; }, 150);
    }
    const dataEl = document.getElementById('data');
    if(dataEl) dataEl.onchange = e=>{ state.data = e.target.value; };
    const tecnico = document.getElementById('tecnico');
    if(tecnico){ tecnico.oninput = e=>{ state.tecnico = e.target.value; }; tecnico.onblur = ()=>render(); }
    const pv = document.getElementById('puntoVendita');
    if(pv) pv.oninput = e=>{ state.puntoVendita = e.target.value; };

    const fotoGen = document.getElementById('fotoGenerale');
    if(fotoGen) fotoGen.onchange = e=>{
      const files = Array.from(e.target.files || []); let remaining = files.length;
      if(!remaining) return;
      files.forEach(f=> compressPhoto(f, src=>{ state.fotoGenerale.push(src); remaining--; if(remaining===0) render(); }));
    };

    root.querySelectorAll('.toggle-btn').forEach(btn=>{
      btn.onclick = ()=>{
        const i = parseInt(btn.dataset.item); const val = btn.dataset.val === 'true';
        state.items[i].ok = val;
        if(val){ state.items[i].note=''; state.items[i].soluzione=''; state.items[i].foto=[]; }
        render();
        setTimeout(()=>{ const cards = document.querySelectorAll('.card'); const target = cards[i+2]; if(target) target.scrollIntoView({behavior:'smooth', block:'center'}); }, 60);
      };
    });
    root.querySelectorAll('[data-note]').forEach(ta=>{ ta.oninput = e=>{ state.items[parseInt(ta.dataset.note)].note = e.target.value; }; });
    root.querySelectorAll('[data-soluzione]').forEach(ta=>{ ta.oninput = e=>{ state.items[parseInt(ta.dataset.soluzione)].soluzione = e.target.value; }; });
    root.querySelectorAll('[data-photo]').forEach(inp=>{
      inp.onchange = e=>{
        const i = parseInt(inp.dataset.photo); const files = Array.from(e.target.files || []); let remaining = files.length;
        if(!remaining) return;
        files.forEach(f=> compressPhoto(f, src=>{ state.items[i].foto.push(src); remaining--; if(remaining===0) render(); }));
      };
    });

    const noteFinali = document.getElementById('noteFinali');
    if(noteFinali) noteFinali.oninput = e=>{ state.noteFinali = e.target.value; };
    const salva = document.getElementById('salva');
    if(salva) salva.onclick = saveIntervento;
  }

  render();
  loadNumeroIntervento();
})();
</script>
